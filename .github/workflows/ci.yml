# CI/CD AirSpoon: сборка и тесты передатчика (Windows) и приёмника (Android);
# по тегу vX.Y.Z — публикация GitHub Release с готовыми exe и apk.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:

# По умолчанию только чтение; contents: write выдан одному заданию release.
permissions:
  contents: read

# Новый запуск для той же ветки/PR/тега отменяет предыдущий.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-ref:
    name: Проверка происхождения тега
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.ref_type == 'tag'
        with:
          persist-credentials: false
          fetch-depth: 0

      # Проверяем до сборки обеих платформ и доступа к ключу подписи.
      - name: Коммит тега входит в main
        if: github.ref_type == 'tag'
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Коммит тега не входит в origin/main; выпуск запрещён"
            exit 1
          fi

      # Без настоящего одинакового ключа в обоих клиентах тег выпускать нельзя.
      - name: Публичный ключ обновлений настроен
        if: github.ref_type == 'tag'
        run: |
          python3 - <<'PY'
          import base64, pathlib, re
          paths = [
              ('windows/internal/update/manifest.go', r'const UpdatePublicKey = "([^"]+)"'),
              ('android/app/src/main/kotlin/io/github/jqssun/airplay/update/UpdateSignature.kt', r'const val PUBLIC_KEY = "([^"]+)"'),
          ]
          keys = [re.search(pattern, pathlib.Path(path).read_text()).group(1) for path, pattern in paths]
          if any('REPLACE_WITH_' in key for key in keys):
              raise SystemExit('::error::Замените заглушку публичного ключа обновлений на обеих платформах')
          if keys[0] != keys[1] or len(base64.b64decode(keys[0], validate=True)) != 32:
              raise SystemExit('::error::Нужен одинаковый 32-байтный публичный ключ Ed25519 на обеих платформах')
          PY

  windows:
    name: Windows (тесты и AirSpoonSender.exe)
    needs: validate-ref
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: windows/go.mod
          cache-dependency-path: windows/go.sum

      # go-winres собирается build.ps1 в windows/.tools при первом запуске.
      - name: Кэш go-winres
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: windows/.tools
          key: go-winres-${{ runner.os }}-${{ hashFiles('windows/build.ps1') }}

      # Значки, ресурсы .exe, go vet, go test (+ тег testhooks), сборка.
      # Тесты сами пропускаются (t.Skip), если на раннере нет монитора/GPU/кодеров.
      - name: Сборка и тесты (build.ps1)
        shell: pwsh
        # Сборка по тегу vX.Y.Z получает версию X.Y.Z (по ней программа ищет обновления).
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:AIRSPOON_VERSION = $env:GITHUB_REF_NAME -replace '^v', '' }
          pwsh -NoProfile -ExecutionPolicy Bypass -File windows/build.ps1

      - name: Проверка результата
        shell: pwsh
        run: |
          $exe = Get-Item windows/bin/AirSpoonSender.exe
          "{0} {1:N0} байт" -f $exe.Name, $exe.Length
          if ($exe.Length -lt 1MB) { throw 'AirSpoonSender.exe подозрительно мал' }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: airspoon-sender-windows
          path: windows/bin/AirSpoonSender.exe
          if-no-files-found: error
          retention-days: 30

  android:
    name: Android (тесты и APK)
    needs: validate-ref
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      # Приватные репозитории получают раннер с ~7 ГБ ОЗУ: куча Gradle побольше, чем 1100m по умолчанию build.sh.
      GRADLE_XMX: 2500m
      # Кэш Gradle лежит на хосте и монтируется в контейнер как /root/.gradle (build.sh принимает путь в VOLUME).
      VOLUME: ${{ github.workspace }}/.gradle-home
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Образ с SDK/NDK весит несколько ГБ; предустановленные на раннере SDK и dotnet не нужны (сборка идёт в Docker).
      - name: Освободить место на диске
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h /

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Тот же образ, что и локально (android/docker/Dockerfile); слои кэшируются в кэше GitHub Actions.
      # Имя тега совпадает с IMAGE по умолчанию в build.sh, поэтому он не пересобирает образ.
      - name: Образ сборки
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: android/docker
          load: true
          push: false
          tags: airspoon-android-build
          cache-from: type=gha,scope=airspoon-android-image
          cache-to: type=gha,scope=airspoon-android-image,mode=max

      - name: Кэш Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ github.workspace }}/.gradle-home/caches
            ${{ github.workspace }}/.gradle-home/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/gradle/libs.versions.toml', 'android/**/*.gradle.kts', 'android/gradle.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # Тесты запускаются отдельно, без ключа подписи в контейнере.
      - name: Модульные тесты (build.sh)
        run: |
          mkdir -p "$VOLUME"
          bash android/docker/build.sh testDebugUnitTest

      # Ветки и PR собирают release-APK с общим отладочным ключом.
      - name: Сборка без ключа AirSpoon (build.sh)
        if: github.ref_type != 'tag'
        run: bash android/docker/build.sh assembleRelease

      # Только тег получает секреты; релиз без ключа AirSpoon не выпускаем.
      - name: Подписанная сборка (build.sh)
        if: github.ref_type == 'tag'
        env:
          KEYSTORE_B64: ${{ secrets.AIRSPOON_KEYSTORE_B64 }}
          AIRSPOON_KEYSTORE_PASSWORD: ${{ secrets.AIRSPOON_KEYSTORE_PASSWORD }}
        run: |
          trap 'rm -f "$RUNNER_TEMP/release.jks"' EXIT
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export AIRSPOON_KEYSTORE="$RUNNER_TEMP/release.jks"
          else
            echo "::error::Нет секрета AIRSPOON_KEYSTORE_B64: релиз без ключа AirSpoon не выпускаем"; exit 1
          fi
          export AIRSPOON_VERSION="${GITHUB_REF_NAME#v}"
          bash android/docker/build.sh assembleRelease
          # Релиз обязан быть подписан ключом AirSpoon (отпечаток сертификата не секрет).
          keytool -printcert -jarfile android/out/airspoon-armeabi-v7a.apk \
            | grep -q 'SHA256: 27:6B:F0:61:BB:1C:AF:21:6D:EC:0B:AF:EF:9D:6D:46:87:60:35:E9:CB:D9:E8:0F:F8:D4:97:F9:0F:43:DA:55'

      # Контейнер работал от root: вернуть файлы текущему пользователю, чтобы кэш и артефакты читались.
      - name: Права на файлы
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" "$VOLUME" android/app/build android/out 2>/dev/null || true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: airspoon-receiver-android
          path: android/out/airspoon-armeabi-v7a.apk
          if-no-files-found: error
          retention-days: 30

      - name: Отчёты тестов (при сбое)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-test-reports
          path: android/app/build/reports/
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Публикация релиза
    needs: [windows, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Ключ подписи обновлений — секрет окружения update-signing (доступ только тегам v*.*.*).
    environment: update-signing
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: airspoon-*
          merge-multiple: true
          path: dist

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: windows/go.mod
          cache-dependency-path: windows/go.sum

      # Секрет доступен только этому шагу задания выпуска по тегу.
      - name: Подписать манифест обновления
        working-directory: windows
        env:
          AIRSPOON_UPDATE_SIGNING_KEY: ${{ secrets.AIRSPOON_UPDATE_SIGNING_KEY }}
        run: |
          if [ -z "$AIRSPOON_UPDATE_SIGNING_KEY" ]; then
            echo "::error::Нет секрета AIRSPOON_UPDATE_SIGNING_KEY; выпуск запрещён"
            exit 1
          fi
          # Совместимое имя для старых клиентов тоже входит в подписанный манифест.
          cp ../dist/airspoon-armeabi-v7a.apk ../dist/airspoon-debug-armeabi-v7a.apk
          go run ./tools/signmanifest sign -version "${GITHUB_REF_NAME#v}" -key-env AIRSPOON_UPDATE_SIGNING_KEY \
            ../dist/AirSpoonSender.exe ../dist/airspoon-armeabi-v7a.apk ../dist/airspoon-debug-armeabi-v7a.apk
          mv airspoon-update.json airspoon-update.json.sig ../dist/

      # Сохраняем пути, чтобы LICENSE/NOTICE двух платформ не перезаписывали друг друга.
      - name: Лицензии релиза
        run: |
          zip -r dist/AirSpoon-LICENSES.zip \
            windows/LICENSE windows/NOTICE windows/licenses \
            android/LICENSE android/NOTICE.md android/licenses \
            android/app/src/main/cpp/third_party/UxPlay/LICENSE \
            android/app/src/main/cpp/third_party/UxPlay/lib/playfair/LICENSE.md \
            android/app/src/main/cpp/third_party/UxPlay/lib/llhttp/LICENSE-MIT \
            android/app/src/main/cpp/third_party/libplist/COPYING* \
            android/app/src/main/cpp/third_party/openssl-cmake/LICENSE \
            android/app/src/main/cpp/third_party/ffmpeg/LICENSE.md \
            android/app/src/main/cpp/third_party/ffmpeg/COPYING*
          test -s dist/AirSpoon-LICENSES.zip

      - name: Создать релиз
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          ls -l dist
          test -s dist/AirSpoonSender.exe
          test -s dist/airspoon-armeabi-v7a.apk
          test -s dist/airspoon-update.json
          test -s dist/airspoon-update.json.sig
          if assets=$(gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets | length'); then
            # Уже опубликованные файлы версии неизменяемы, даже при повторном запуске.
            if [ "$assets" != 0 ]; then
              echo "::error::Релиз $TAG уже содержит файлы; повторная публикация запрещена"; exit 1
            fi
            gh release upload "$TAG" dist/AirSpoonSender.exe dist/airspoon-armeabi-v7a.apk dist/airspoon-debug-armeabi-v7a.apk dist/airspoon-update.json dist/airspoon-update.json.sig dist/AirSpoon-LICENSES.zip --repo "$REPO"
          else
            gh release create "$TAG" dist/AirSpoonSender.exe dist/airspoon-armeabi-v7a.apk dist/airspoon-debug-armeabi-v7a.apk dist/airspoon-update.json dist/airspoon-update.json.sig dist/AirSpoon-LICENSES.zip \
              --repo "$REPO" --title "$TAG" --generate-notes --verify-tag
          fi
