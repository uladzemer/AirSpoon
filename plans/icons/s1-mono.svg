<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Grid 8px. Composite bbox 128..896 x 256..768 = 768x512 (inside 768x576) keyline rect, centered at 512,512.
       Single stroke 64; radius set {32,64,96}: big screen outer 96 (centerline 64, inner 32), small 64, knockout 96 (gap 32).
       No optical compensations. -->
  <defs><mask id="k" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
    <rect width="1024" height="1024" fill="#fff"/>
    <rect x="480" y="480" width="480" height="336" rx="96" fill="#000"/>
  </mask></defs>
  
  <g>
    <rect x="160" y="288" width="576" height="352" rx="64" fill="none" stroke="#000" stroke-width="64" mask="url(#k)"/>
    <rect x="512" y="512" width="384" height="256" rx="64" fill="#000"/>
  </g>
</svg>
